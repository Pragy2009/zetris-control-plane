server:
  listenAddress: ":80"
  exposedAddress: "https://netbird.ztnaiitm.me:443"
  stunPorts:
    - 3478
  metricsPort: 9090
  healthcheckAddress: ":9000"
  logLevel: "info"
  logFile: "console"

  authSecret: "CHANGE_ME_BEFORE_DEPLOYMENT"
  dataDir: "/var/lib/netbird"

  store:
    engine: "postgres"
    postgresDSN: "host=n1-postgres port=5432 user=admin password=admin_password_change_me dbname=netbird sslmode=disable"
    encryptionKey: "CHANGE_ME_BEFORE_DEPLOYMENT"

  auth:
    issuer: "https://netbird.ztnaiitm.me/oauth2"
    signKeyRefreshEnabled: true
    dashboardRedirectURIs:
      - "https://netbird.ztnaiitm.me/nb-auth"
      - "https://netbird.ztnaiitm.me/nb-silent-auth"
    cliRedirectURIs:
      - "http://localhost:53000/"

  reverseProxy:
    trustedHTTPProxies:
      - "172.30.0.10/32"

